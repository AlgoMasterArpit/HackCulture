server {
    listen 3000;
    root /usr/share/nginx/html;

    # Resolve the gateways at request time, so the page still starts when the
    # baseline profile is not running, and a restarted gateway's new address is
    # used instead of the one nginx saw at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Only the chat route is proxied. The cache admin API stays off this port.
    location = /v1/chat/completions {
        set $gateway http://gateway:8080;
        proxy_pass $gateway/v1/chat/completions;
        proxy_set_header x-bestbefore-internal "";
        proxy_read_timeout 120s;
    }

    # The plain TTL-only gateway, for the side-by-side tab.
    location = /baseline/v1/chat/completions {
        set $baseline http://gateway-baseline:8080;
        proxy_pass $baseline/v1/chat/completions;
        proxy_set_header x-bestbefore-internal "";
        proxy_read_timeout 120s;
    }
}
