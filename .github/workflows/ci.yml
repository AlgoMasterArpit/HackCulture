name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  e2e:
    name: End to end against a real Bifrost
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build Bifrost with the plugin and start it with the mocks
        run: docker compose -f e2e/compose.yml up -d --build
      - name: Run the end-to-end suite
        run: python3 e2e/test_gateway.py
      - name: Gateway logs
        if: failure()
        run: docker compose -f e2e/compose.yml logs gateway
