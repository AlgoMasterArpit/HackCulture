<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="BestBefore architecture: request path, freshness checks, outcomes">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="980" height="470" rx="16" fill="#ffffff"/>

  <text x="28" y="40" font-size="12" font-weight="800" letter-spacing="1.5" fill="#64748b">1 · REQUEST PATH (UNCHANGED BIFROST)</text>
  <g font-size="14" text-anchor="middle">
    <rect x="28" y="54" width="170" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="113" y="79" font-weight="700" fill="#0f172a">Any app</text>
    <text x="113" y="98" font-size="12" fill="#64748b">OpenAI-compatible call</text>

    <rect x="258" y="54" width="200" height="58" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="358" y="79" font-weight="700" fill="#0f172a">Bifrost semantic cache</text>
    <text x="358" y="98" font-size="12" fill="#64748b">expires by TTL only</text>

    <rect x="518" y="54" width="200" height="58" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="618" y="79" font-weight="700" fill="#0f172a">Bifrost routing</text>
    <text x="618" y="98" font-size="12" fill="#64748b">fallbacks · retries · logs</text>

    <rect x="778" y="54" width="170" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="863" y="79" font-weight="700" fill="#0f172a">Gemini</text>
    <text x="863" y="98" font-size="12" fill="#64748b">writes the answer</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M198 83 H252" marker-end="url(#a)"/>
    <path d="M458 83 H512" marker-end="url(#a)"/>
    <path d="M718 83 H772" marker-end="url(#a)"/>
    <path d="M358 112 V150 H113 V176" marker-end="url(#a)"/>
  </g>
  <text x="240" y="144" font-size="12" fill="#64748b" text-anchor="middle">every answer, cache hits included</text>

  <rect x="16" y="160" width="948" height="148" rx="14" fill="#4f46e5"/>
  <text x="28" y="196" font-size="12" font-weight="800" letter-spacing="1.5" fill="#c7d2fe" transform="translate(0 -16)">2 · BESTBEFORE PLUGIN (HTTP TRANSPORT POST-HOOK)</text>
  <g font-size="14" text-anchor="middle" fill="#ffffff">
    <rect x="28" y="196" width="170" height="96" rx="10" fill="#6366f1"/>
    <text x="113" y="226" font-weight="700">Regex gate</text>
    <text x="113" y="248" font-size="12" fill="#e0e7ff">prices, versions, laws,</text>
    <text x="113" y="264" font-size="12" fill="#e0e7ff">leaders, "latest"</text>
    <text x="113" y="282" font-size="11.5" font-weight="700" fill="#bbf7d0">no match = $0, done</text>

    <rect x="214" y="196" width="170" height="96" rx="10" fill="#6366f1"/>
    <text x="299" y="226" font-weight="700">Extract claims</text>
    <text x="299" y="248" font-size="12" fill="#e0e7ff">atomic, self-contained,</text>
    <text x="299" y="264" font-size="12" fill="#e0e7ff">one search query each</text>
    <text x="299" y="282" font-size="11.5" font-weight="700" fill="#c7d2fe">Gemini via Bifrost</text>

    <rect x="400" y="196" width="170" height="96" rx="10" fill="#6366f1"/>
    <text x="485" y="226" font-weight="700">Search the web</text>
    <text x="485" y="248" font-size="12" fill="#e0e7ff">claims searched</text>
    <text x="485" y="264" font-size="12" fill="#e0e7ff">in parallel</text>
    <text x="485" y="282" font-size="11.5" font-weight="700" fill="#a5f3fc">Tavily</text>

    <rect x="586" y="196" width="170" height="96" rx="10" fill="#6366f1"/>
    <text x="671" y="226" font-weight="700">Judge + quote</text>
    <text x="671" y="248" font-size="12" fill="#e0e7ff">verdict must cite a</text>
    <text x="671" y="264" font-size="12" fill="#e0e7ff">verbatim source quote</text>
    <text x="671" y="282" font-size="11.5" font-weight="700" fill="#c7d2fe">Gemini via Bifrost</text>

    <rect x="772" y="196" width="180" height="96" rx="10" fill="#312e81"/>
    <text x="862" y="226" font-weight="700">Score in Go</text>
    <text x="862" y="248" font-size="12" fill="#e0e7ff">quote not found in the</text>
    <text x="862" y="264" font-size="12" fill="#e0e7ff">source = verdict ignored</text>
    <text x="862" y="282" font-size="11.5" font-weight="700" fill="#fde68a">deterministic</text>
  </g>
  <g stroke="#c7d2fe" stroke-width="2" fill="none">
    <path d="M198 244 H208" marker-end="url(#a)"/>
    <path d="M384 244 H394" marker-end="url(#a)"/>
    <path d="M570 244 H580" marker-end="url(#a)"/>
    <path d="M756 244 H766" marker-end="url(#a)"/>
  </g>

  <text x="952" y="346" font-size="12" font-weight="800" letter-spacing="1.5" fill="#64748b" text-anchor="end">3 · OUTCOME</text>
  <path d="M862 308 V330 H120 V352 M355 330 V352 M590 330 V352 M840 330 V352" stroke="#64748b" stroke-width="2" fill="none"/>
  <g font-size="13.5" text-anchor="middle">
    <rect x="28" y="356" width="184" height="88" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="120" y="384" font-weight="700" fill="#0f172a">Answer annotated</text>
    <text x="120" y="404" font-size="12" fill="#64748b">score, claims, sources</text>
    <text x="120" y="420" font-size="12" fill="#64748b">in body + x-bestbefore-*</text>

    <rect x="248" y="356" width="214" height="88" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="355" y="384" font-weight="700" fill="#14532d">Fresh: stays cached</text>
    <text x="355" y="404" font-size="12" fill="#166534">ledger sets next check:</text>
    <text x="355" y="420" font-size="12" fill="#166534">prices 24h · versions 72h · 7d</text>

    <rect x="498" y="356" width="184" height="88" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="590" y="384" font-weight="700" fill="#7f1d1d">Stale: evicted</text>
    <text x="590" y="404" font-size="12" fill="#991b1b">DELETE /api/cache/</text>
    <text x="590" y="420" font-size="12" fill="#991b1b">clear/{cache_id}</text>

    <rect x="718" y="356" width="234" height="88" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="835" y="384" font-weight="700" fill="#78350f">Unsure or checker down</text>
    <text x="835" y="404" font-size="12" fill="#92400e">"uncertain" / "unchecked"</text>
    <text x="835" y="420" font-size="12" fill="#92400e">never evicts (fails safe)</text>
  </g>
</svg>
