<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="BestBefore architecture: request path, freshness checks and healing, outcomes, background sweeper">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c7d2fe"/></marker>
  </defs>
  <rect width="980" height="560" rx="16" fill="#ffffff"/>

  <text x="28" y="40" font-size="12" font-weight="800" letter-spacing="1.5" fill="#64748b">1 · REQUEST PATH (UNCHANGED BIFROST)</text>
  <g font-size="14" text-anchor="middle">
    <rect x="28" y="54" width="170" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="113" y="79" font-weight="700" fill="#0f172a">Any app</text>
    <text x="113" y="98" font-size="12" fill="#64748b">OpenAI-compatible call</text>
    <rect x="258" y="54" width="200" height="58" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="358" y="79" font-weight="700" fill="#0f172a">Bifrost semantic cache</text>
    <text x="358" y="98" font-size="12" fill="#64748b">hit: served instantly</text>
    <rect x="518" y="54" width="200" height="58" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="618" y="79" font-weight="700" fill="#0f172a">Bifrost routing</text>
    <text x="618" y="98" font-size="12" fill="#64748b">fallbacks · retries · logs</text>
    <rect x="778" y="54" width="170" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="863" y="79" font-weight="700" fill="#0f172a">Gemini</text>
    <text x="863" y="98" font-size="12" fill="#64748b">writes the answer</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M198 83 H252" marker-end="url(#a)"/>
    <path d="M458 83 H512" marker-end="url(#a)"/>
    <path d="M718 83 H772" marker-end="url(#a)"/>
    <path d="M863 112 V150 H700 V176" marker-end="url(#a)"/>
  </g>
  <text x="690" y="144" font-size="12" fill="#64748b" text-anchor="end">every answer, before the cache stores it</text>

  <rect x="16" y="160" width="948" height="148" rx="14" fill="#4f46e5"/>
  <text x="28" y="180" font-size="12" font-weight="800" letter-spacing="1.5" fill="#c7d2fe">2 · BESTBEFORE PLUGIN (RUNS BEFORE THE CACHE WRITES)</text>
  <g font-size="13.5" text-anchor="middle" fill="#ffffff">
    <rect x="28" y="196" width="142" height="96" rx="10" fill="#6366f1"/>
    <text x="99" y="224" font-weight="700">Regex gate</text>
    <text x="99" y="245" font-size="11.5" fill="#e0e7ff">prices, versions,</text>
    <text x="99" y="260" font-size="11.5" fill="#e0e7ff">laws, leaders</text>
    <text x="99" y="280" font-size="11.5" font-weight="700" fill="#bbf7d0">no match = $0</text>

    <rect x="184" y="196" width="142" height="96" rx="10" fill="#6366f1"/>
    <text x="255" y="224" font-weight="700">Extract claims</text>
    <text x="255" y="245" font-size="11.5" fill="#e0e7ff">atomic, one search</text>
    <text x="255" y="260" font-size="11.5" fill="#e0e7ff">query each</text>
    <text x="255" y="280" font-size="11.5" font-weight="700" fill="#c7d2fe">Gemini via Bifrost</text>

    <rect x="340" y="196" width="142" height="96" rx="10" fill="#6366f1"/>
    <text x="411" y="224" font-weight="700">Search the web</text>
    <text x="411" y="245" font-size="11.5" fill="#e0e7ff">claims searched</text>
    <text x="411" y="260" font-size="11.5" fill="#e0e7ff">in parallel</text>
    <text x="411" y="280" font-size="11.5" font-weight="700" fill="#a5f3fc">Tavily</text>

    <rect x="496" y="196" width="142" height="96" rx="10" fill="#6366f1"/>
    <text x="567" y="224" font-weight="700">Judge + quote</text>
    <text x="567" y="245" font-size="11.5" fill="#e0e7ff">verdict must cite a</text>
    <text x="567" y="260" font-size="11.5" fill="#e0e7ff">verbatim quote</text>
    <text x="567" y="280" font-size="11.5" font-weight="700" fill="#c7d2fe">Gemini via Bifrost</text>

    <rect x="652" y="196" width="142" height="96" rx="10" fill="#312e81"/>
    <text x="723" y="224" font-weight="700">Score in Go</text>
    <text x="723" y="245" font-size="11.5" fill="#e0e7ff">unproven verdict</text>
    <text x="723" y="260" font-size="11.5" fill="#e0e7ff">is thrown away</text>
    <text x="723" y="280" font-size="11.5" font-weight="700" fill="#fde68a">deterministic</text>

    <rect x="808" y="196" width="144" height="96" rx="10" fill="#0e7490"/>
    <text x="880" y="224" font-weight="700">Heal if stale</text>
    <text x="880" y="245" font-size="11.5" fill="#cffafe">rewrite with the</text>
    <text x="880" y="260" font-size="11.5" fill="#cffafe">verified values; Go</text>
    <text x="880" y="280" font-size="11.5" font-weight="700" fill="#cffafe">checks + cites</text>
  </g>
  <g stroke="#c7d2fe" stroke-width="2" fill="none">
    <path d="M170 244 H178" marker-end="url(#w)"/>
    <path d="M326 244 H334" marker-end="url(#w)"/>
    <path d="M482 244 H490" marker-end="url(#w)"/>
    <path d="M638 244 H646" marker-end="url(#w)"/>
    <path d="M794 244 H802" marker-end="url(#w)"/>
  </g>

  <path d="M880 308 V330 H120 V352 M355 330 V352 M590 330 V352 M835 330 V352" stroke="#64748b" stroke-width="2" fill="none"/>
  <text x="952" y="346" font-size="12" font-weight="800" letter-spacing="1.5" fill="#64748b" text-anchor="end">3 · OUTCOME</text>
  <g font-size="13.5" text-anchor="middle">
    <rect x="28" y="356" width="184" height="88" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="120" y="384" font-weight="700" fill="#0f172a">Answer annotated</text>
    <text x="120" y="404" font-size="12" fill="#64748b">claims, quotes, sources</text>
    <text x="120" y="420" font-size="12" fill="#64748b">in body + x-bestbefore-*</text>

    <rect x="248" y="356" width="214" height="88" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="355" y="384" font-weight="700" fill="#14532d">Fresh: cached as is</text>
    <text x="355" y="404" font-size="12" fill="#166534">with a best-before date:</text>
    <text x="355" y="420" font-size="12" fill="#166534">prices 24h · versions 72h · 7d</text>

    <rect x="498" y="356" width="184" height="88" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="590" y="384" font-weight="700" fill="#0c4a6e">Stale: healed</text>
    <text x="590" y="404" font-size="12" fill="#075985">the corrected answer</text>
    <text x="590" y="420" font-size="12" fill="#075985">is what gets cached</text>

    <rect x="718" y="356" width="234" height="88" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="835" y="384" font-weight="700" fill="#78350f">Can't heal or unsure</text>
    <text x="835" y="404" font-size="12" fill="#92400e">stale: never cached</text>
    <text x="835" y="420" font-size="12" fill="#92400e">checker down: never evicts</text>
  </g>

  <rect x="16" y="468" width="948" height="76" rx="14" fill="#0f172a"/>
  <text x="28" y="492" font-size="12" font-weight="800" letter-spacing="1.5" fill="#94a3b8">4 · BACKGROUND SWEEPER</text>
  <text x="28" y="516" font-size="14" fill="#e2e8f0">When a cached answer's best-before date passes, the sweeper re-checks it without waiting for a user.</text>
  <text x="28" y="534" font-size="14" fill="#e2e8f0">If the world changed, the entry is evicted, and the next ask stores a freshly healed answer.</text>
</svg>
